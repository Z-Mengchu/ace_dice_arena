# 放置到 /etc/nginx/conf.d/ace-dice-arena.conf；先执行 npm run build 生成 frontend/dist。
upstream ace_dice_backend {
    server 127.0.0.1:8082;
    keepalive 128;
}

server {
    listen 80;
    server_name _;
    root /home/app/game/frontend/dist;
    keepalive_timeout 15s;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json;
    gzip_vary on;

    # 页面和静态资源由 Nginx 直接返回，不占用 Spring Boot 的请求线程和数据库连接。
    location = /login { add_header Cache-Control "no-cache"; try_files /login.html =404; }
    location = /lobby { add_header Cache-Control "no-cache"; try_files /lobby.html =404; }
    location = /admin { add_header Cache-Control "no-cache"; try_files /admin.html =404; }
    location = /player { add_header Cache-Control "no-cache"; try_files /player.html =404; }
    location = /sandbox-player { add_header Cache-Control "no-cache"; try_files /sandbox-player.html =404; }
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    location /api/lobby/events {
        proxy_pass http://ace_dice_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    location /api/events {
        proxy_pass http://ace_dice_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    location / {
        proxy_pass http://ace_dice_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
